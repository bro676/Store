name: Diagnose payment readiness
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-payment-readiness.py
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/diagnose-payment-readiness.py
      - run: node --check nexa-store-premium-web/server/src/server.js
      - name: Commit diagnostic logging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexa-store-premium-web/server/src/server.js
          git commit -m "Log safe payment readiness diagnostics"
          git push
