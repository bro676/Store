name: Validate live checkout
on:
  push:
    branches: [main]
    paths:
      - scripts/validate-live-checkout.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("nexa-store-premium-web/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "inline application script missing"
          Path("/tmp/nexa-inline.js").write_text(scripts[-1])
          PY
          node --check /tmp/nexa-inline.js
      - name: Test fixed-point FX calculation
        run: |
          node - <<'JS'
          const rate = 14287.5;
          const sypMinor = 18000n * 100n;
          const rateScaled = BigInt(Math.round(rate * 10000));
          const usdMinor = (sypMinor * 10000n + rateScaled / 2n) / rateScaled;
          if (usdMinor !== 126n) throw new Error("Expected 18000 legacy SYP -> 126 cents USD");
          console.log("FX fixed-point test passed: 18,000 SYP -> $1.26");
          JS
      - name: Verify live Sham Cash configuration
        run: |
          for i in $(seq 1 30); do
            response=$(curl --silent --show-error --fail https://nexa-store-9st4.onrender.com/api/payments/config || true)
            if [ -n "$response" ]; then
              echo "$response" > /tmp/payment-config.json
              python - <<'PY'
          import json
          data=json.load(open("/tmp/payment-config.json"))
          print("provider:", data.get("provider"))
          print("enabled:", data.get("enabled"))
          print("currency options:", data.get("currencies"))
          print("fx rate configured:", bool(data.get("sypPerUsd")))
          print("wallet status message:", data.get("message"))
          if data.get("enabled") is not True:
              raise SystemExit(1)
          if set(data.get("currencies", [])) != {"SYP", "USD"}:
              raise SystemExit("currency list mismatch")
          PY
              exit 0
            fi
            sleep 10
          done
          echo "Live payment config endpoint did not return a valid response"
          exit 1
