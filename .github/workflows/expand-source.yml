name: Expand Nexa source
on:
  push:
    branches: [main]
    paths: [README.md]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        run: |
          cat nexa-store-source.part* | base64 -d > /tmp/nexa-source.tar.xz
          xz -t /tmp/nexa-source.tar.xz
          tar -xJf /tmp/nexa-source.tar.xz -C .
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexa-store-premium-web
          if ! git diff --cached --quiet; then
            git commit -m "Expand Nexa Store source for maintenance"
            git push
          fi
