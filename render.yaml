services:
  - type: web
    name: nexa-store
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: "cat nexa-store-source.part* | base64 -d | tar -xJ -C . && npm --prefix nexa-store-premium-web/server install --omit=dev"
    startCommand: "npm --prefix nexa-store-premium-web/server start"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nexa-store-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_CURRENCY
        value: SYP
      - key: PAYMENT_ORDER_TTL_MINUTES
        value: "15"
      - key: PAYMENT_MAX_AGE_MINUTES
        value: "15"
      - key: PAYMENT_FUTURE_SKEW_SECONDS
        value: "90"
      - key: SHAM_API_BASE_URL
        value: https://apis-shamcash.com/api
      - key: SHAM_API_TOKEN
        sync: false
      - key: SHAM_WALLET_ID
        sync: false
      - key: SHAM_RECEIVER_LABEL
        value: Nexa Store - Sham Cash
      - key: SHAM_TIMEZONE_OFFSET_MINUTES
        value: "180"
      - key: ADMIN_API_KEY
        generateValue: true

databases:
  - name: nexa-store-db
    databaseName: nexa_store
    user: nexa_store
    region: frankfurt
    plan: basic-256mb
