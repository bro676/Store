async function doOrder(e){e.preventDefault();if(!state.selectedPack)return;const button=e.currentTarget.querySelector('button[type="submit"]');button.disabled=true;button.textContent='جارٍ إنشاء فاتورة شام كاش…';try{const pack=state.selectedPack;const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({categoryId:pack.category,productId:pack.item,optionId:pack.option,packIndex:pack.index,currency:$('orderCurrency').value,customerName:$('customerName').value.trim(),customerPhone:$('customerPhone').value.trim(),accountId:$('accountId').value.trim(),notes:$('orderNotes').value.trim()})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||'تعذر إنشاء فاتورة الدفع عبر شام كاش.');const d=storageRead();d.orders=d.orders||[];const order={id:data.orderId,name:data.product||pack.name,price:pack.price,amountMinor:data.amountMinor,currency:data.currency,date:new Intl.DateTimeFormat('ar-SY',{dateStyle:'medium'}).format(new Date()),status:'pending_payment',expiresAt:data.expiresAt,invoiceNumber:data.invoiceNumber};d.orders.unshift(order);storageSave(d);state.pendingOrder=data.orderId;$('paymentOrderId').value=data.orderId;$('paymentOrderSummary').innerHTML=`<span>المبلغ المطلوب · ${esc(data.currency)}</span><strong>${formatMinor(data.amountMinor,data.currency)}</strong><small>الفاتورة صالحة حتى ${esc(new Date(data.expiresAt).toLocaleString('ar-SY'))}</small>`;renderInvoiceDetails(data);$('shamCashTransactionId').value='';$('shamCashPaymentResult').textContent='';e.currentTarget.reset();closeModal();renderOrders();navigate('wallet');showToast('تم إنشاء فاتورة شام كاش الرسمية. حوّل المبلغ الظاهر ثم أدخل رقم العملية.');}catch(err){showToast(err.message||'تعذر الاتصال بالخادم. لم يتم إنشاء الفاتورة.');}finally{button.disabled=false;button.textContent='إنشاء الطلب والمتابعة للدفع';}}
async function loadPaymentConfig(){try{const r=await fetch('/api/payments/config',{cache:'no-store'});const d=await r.json();const badge=$('shamCashStatusBadge'),status=$('shamCashServiceStatus');if(!r.ok)throw new Error('تعذر فحص بوابة الدفع.');paymentConfigEnabled=!!d.enabled;sypPerUsd=Number(d.fxReady?d.sypPerUsd:0);fxUpdatedAt=d.fxUpdatedAt||'';const usdOption=$('orderCurrency')?.querySelector('option[value="USD"]');if(usdOption)usdOption.disabled=!d.fxReady;if(!d.fxReady&&$('orderCurrency')?.value==='USD')$('orderCurrency').value='SYP';renderCurrencyPreview();badge.textContent=d.enabled?'بوابة API جاهزة':'بانتظار إعداد الخادم';status.textContent=(d.message||'حالة بوابة الدفع غير معروفة.')+(!d.fxReady?' · سعر الدولار بانتظار اتصال SP Today الموثوق.':'');status.classList.toggle('ready',!!d.enabled);status.classList.toggle('error',!d.enabled);if(d.enabled){$('shamCashReceiverInfo').innerHTML=`<span>محفظة الاستلام</span><strong>${esc(d.receiverLabel||'محفظة Nexa Store')}</strong><small>عنوان الاستلام الدقيق يظهر داخل كل فاتورة رسمية.</small>`;}else{$('shamCashReceiverInfo').innerHTML='<span>محفظة الاستلام</span><strong>لم يتم تفعيل بوابة الدفع بعد</strong><small>لا تحوّل أي مبلغ قبل ظهور تفاصيل الفاتورة الرسمية.</small>';}}catch(e){$('shamCashStatusBadge').textContent='الخادم غير متصل';$('shamCashServiceStatus').textContent='تعذر الوصول إلى خادم الدفع. شغّل الموقع عبر خادم Nexa وليس بفتح ملف HTML مباشرة.';$('shamCashServiceStatus').classList.add('error');}}
async function loadShamCashOrderSummary(){const orderId=$('paymentOrderId').value.trim().toUpperCase(),summary=$('paymentOrderSummary');if(!/^NX-[A-F0-9]{20}$/.test(orderId))return;try{const r=await fetch('/api/orders/'+encodeURIComponent(orderId),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'لم يتم العثور على الطلب.');summary.innerHTML=`<span>المبلغ المطلوب · ${esc(d.status==='paid'?'مدفوع':d.status==='expired'?'منتهي':'بانتظار الدفع')} · ${esc(d.currency)}</span><strong>${formatMinor(d.amountMinor,d.currency)}</strong><small>تنتهي الفاتورة في ${esc(new Date(d.expiresAt).toLocaleString('ar-SY'))}</small>`;renderInvoiceDetails(d);}catch(e){summary.innerHTML='<span>ملخص الطلب</span><strong>تعذر تحميل تفاصيل الطلب</strong><small>تأكد من رقم الطلب أو أعد المحاولة.</small>';}}
async function verifyShamCashPayment(e){e.preventDefault();const button=$('verifyShamCashButton'),result=$('shamCashPaymentResult');const orderId=$('paymentOrderId').value.trim().toUpperCase(),transactionId=$('shamCashTransactionId').value.trim();if(!/^NX-[A-F0-9]{20}$/.test(orderId)){result.className='wallet-payment-result error';result.textContent='رقم طلب Nexa غير صالح.';return;}if(!/^[A-Za-z0-9_-]{1,64}$/.test(transactionId)){result.className='wallet-payment-result error';result.textContent='أدخل رقم العملية كما يظهر في التطبيق (حتى 64 حرفاً أو رقماً).';return;}button.disabled=true;button.textContent='جارٍ التحقق عبر شام كاش…';result.className='wallet-payment-result';result.textContent='نطابق العملية الواردة مع عنوان المحفظة والوقت والمبلغ والفاتورة، ثم نثبت رقم التحويل لمرة واحدة فقط…';try{const r=await fetch('/api/shamcash/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId,transactionId})});const d=await r.json();if(!r.ok||!d.ok){const retry=r.headers.get('Retry-After');throw new Error(retry?`${d.message||'تعذر التحقق'} (انتظر ${retry} ثانية قبل إعادة المحاولة)`:d.message||'لم يتم قبول العملية.');}result.className='wallet-payment-result success';result.textContent='تم التحقق من رقم العملية والفاتورة ومحفظة الاستلام. طلبك مدفوع ومؤكد.';const saved=storageRead();const order=(saved.orders||[]).find(o=>o.id===orderId);if(order){order.status='paid';storageSave(saved);renderOrders();}showToast('تم اعتماد الدفع عبر شام كاش API.');}catch(err){result.className='wallet-payment-result error';result.textContent=err.message||'تعذر التحقق. لم يتم تأكيد الدفع.';}finally{button.disabled=false;button.textContent='تحقق واعتماد الدفع ←';}}

function renderSupportState(){const d=storageRead();const tickets=d.supportTickets||[];const result=$('supportTicketResult');if(result&&tickets.length){const t=tickets[0];$('supportTicketText').textContent=`رقم المسودة ${t.id} · ${t.issue}`;result.classList.remove('hidden');const message=`مرحباً، أود التواصل مع الدعم الفني في Nexa Store.\nرقم البلاغ: ${t.id}\nالاسم: ${t.name}\nالتواصل: ${t.contact}\nنوع الطلب: ${t.issue}\nرقم الطلب: ${t.orderId||'غير محدد'}\nالتفاصيل: ${t.message}`;$('supportTicketWA').href=`https://wa.me/963936382101?text=${encodeURIComponent(message)}`;$('supportTicketEmail').href=`mailto:support.nsde@gmail.com?subject=${encodeURIComponent('بلاغ دعم '+t.id)}&body=${encodeURIComponent(message)}`}}

function addAssistantMessage(text,who='bot',action=null){const messages=$('assistantMessages');const bubble=document.createElement('div');bubble.className=`assistant-message ${who==='user'?'user-message':'bot-message'}`;const para=document.createElement('p');para.textContent=text;bubble.append(para);if(action){const btn=document.createElement('button');btn.type='button';btn.className='assistant-action';btn.textContent=action.label;btn.addEventListener('click',()=>{if(action.type==='page'){if(action.type==='page'&&action.page==='store')resetCatalog();navigate(action.page)}else if(action.type==='item')openItem(action.id);else if(action.type==='category'){resetCatalog();state.category=action.id;navigate('store')}closeAssistant()});bubble.append(btn)}messages.append(bubble);messages.scrollTop=messages.scrollHeight}
function assistantNormalize(value){return String(value||'').toLocaleLowerCase('ar').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/[؟?!.,،؛]/g,' ').replace(/\s+/g,' ').trim()}
function assistantAnswer(raw){const q=assistantNormalize(raw);let answer='';let action=null;
 if(!q){answer='اكتب سؤالك وسأحاول توجيهك للمكان الصحيح.'}
 else if(/^(مرحبا|اهلا|السلام عليكم|هاي|hello|hi)/.test(q)){answer='أهلاً وسهلاً! فيني ساعدك تختار لعبة أو بطاقة أو اشتراك، أو أوصلك للدعم الفني. شو حابب تعرف؟'}
 else if(/كيف اطلب|طريقة الطلب|اعمل طلب|انشاء طلب|اشتري|الشراء/.test(q)){answer='الطلب يمر بأربع خطوات: اختر القسم والمنتج والمنطقة والباقة، ثم أرسل الطلب إلى الخادم وأكمل الدفع عبر رقم عملية شام كاش بعد تفعيل الربط. لا تتم خدمة الطلب تلقائياً حتى يُربط نظام التسليم.';action={type:'page',page:'store',label:'الانتقال إلى المتجر'}}
 else if(/وين طلبي|اين طلبي|طلبي|متابعة|تتبع|حالة الطلب|طلباتي/.test(q)){answer='افتح صفحة «طلباتي» لمراجعة الطلبات المحفوظة. تذكير: الطلبات هنا تجريبية ومحلية وليست مرتبطة بنظام تتبع أو تنفيذ خارجي.';action={type:'page',page:'orders',label:'عرض طلباتي'}}
 else if(/دفع|شام كاش|محفظ|رصيد|تحويل|السعر|الاسعار|كم سعر/.test(q)){answer=paymentConfigEnabled?'الدفع عبر شام كاش متاح من صفحة المحفظة. ينشئ الخادم فاتورة رسمية، ثم يطابق رقم العملية والمبلغ والعملة ومحفظة الاستلام والوقت قبل اعتمادها لمرة واحدة.':'الدفع عبر شام كاش يظهر في صفحة المحفظة، لكن الخادم لم يُفعّل بوابة الدفع بعد. لا تحوّل أي مبلغ قبل ظهور حالة الجاهزية والفاتورة الرسمية.';action={type:'page',page:'wallet',label:'فتح الدفع عبر شام كاش'}}
 else if(/كلمة المرور|باسورد|رمز التحقق|otp|كود تحقق/.test(q)){answer='لحماية حسابك، لا تشارك كلمة المرور أو رمز التحقق مع الدعم أو أي شخص. عادةً يكفي معرّف اللاعب أو رقم الطلب ووصف المشكلة.'}
 else if(/دعم|مشكلة|شكوى|تواصل|واتساب|بريد|ايميل|مساعدة/.test(q)){answer='تقدر تفتح مركز الدعم، تختار نوع المشكلة، تضيف رقم الطلب إن وجد، وتجهز مسودة ترسلها بنفسك عبر واتساب أو البريد. المساعد لا يرسل رسائل بالنيابة عنك.';action={type:'page',page:'support',label:'فتح مركز الدعم'}}
 else {
   let match=null;const aliases={freefire:['فري فاير','فريفاير','فري فاير'],pubg:['ببجي','ببجي موبايل','شدات'],roblox:['روبلوكس'],codm:['كول اوف ديوتي','كود موبايل'],tiktok:['تيك توك','عملات تيك توك'],googleplay:['جوجل بلاي','قوقل بلاي'],playstation:['بلايستيشن','بلاي ستيشن','psn'],spotify:['سبوتيفاي'],netflix:['نتفلكس','نتفليكس']};for(const c of categories){for(const it of c.items){const names=[it.name,it.id,it.desc,...(aliases[it.id]||[])].map(assistantNormalize);if(names.some(n=>n&&q.includes(n))) {match={c,it};break}}if(match)break}
   if(match){answer=`وجدت لك ${match.it.name} ضمن قسم ${match.c.name}. ${match.it.desc} افتح المنتج حتى تشوف المناطق أو الخطط والباقات المتاحة في النسخة التجريبية.`;action={type:'item',id:match.it.id,label:'عرض '+match.it.name}}

 }
 addAssistantMessage(raw,'user');addAssistantMessage(answer,'bot',action);
}
